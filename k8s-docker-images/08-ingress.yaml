apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-ingress
  namespace: weather-system
  # Eliminamos la anotación de rewrite-target para que mande la ruta tal cual
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /tweet
        pathType: Prefix
        backend:
          service:
            name: api-rust-service
            port:
              number: 8000