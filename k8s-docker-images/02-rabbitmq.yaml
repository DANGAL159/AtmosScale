apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: weather-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672  # Puerto de comunicación para tus Go Writers
        - containerPort: 15672 # Puerto de la Interfaz Web (Management UI)
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: weather-system
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672